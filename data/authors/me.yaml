bio: |
  <span class="bio-hello">Hello! 👋</span>

  I'm Chongyang, a researcher who's into **physical AI & robotics**, equally passionate about **sports, music, humanities, and sociology**. <span class="bio-quote">I'm doing multimodal learning and reinforcement learning in the grandest simulator of all: *life* — one episode at a time, learning what's worth the strife.</span>

  <span class="collab-cta">I'm openly seeking collaborations — if you have any research ideas or projects, feel free to reach out!</span>

  <span class="bio-hello">Education 🎓</span>

  I've been studying at **Sichuan University** for 7 years and have fallen deeply in love with **Chengdu**. I received my B.Eng. in Software Engineering and am now pursuing my Ph.D. in Computer Science.

