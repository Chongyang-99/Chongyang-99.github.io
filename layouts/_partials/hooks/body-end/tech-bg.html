<canvas id="tech-bg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>

<!-- WeChat Modal -->
<div id="wechat-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;justify-content:center;align-items:center;" onclick="this.style.display='none'">
  <div style="background:#fff;border-radius:12px;padding:30px 40px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.2);" onclick="event.stopPropagation()">
    <div style="font-size:1.5rem;margin-bottom:10px;">💬 WeChat</div>
    <div id="wechat-id" style="font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:#333;padding:10px 20px;background:#f5f5f5;border-radius:6px;cursor:pointer;" onclick="navigator.clipboard.writeText('godxzp');this.nextElementSibling.textContent='Copied !'">godxzp</div>
    <div style="margin-top:12px;font-size:0.85rem;color:#999;">Click ID to copy</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('tech-bg');
  const ctx = canvas.getContext('2d');
  let w, h, bots = [], particles = [];
  const BOT_COUNT = 8;
  const PARTICLE_COUNT = 40;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function initBots() {
    bots = [];
    for (let i = 0; i < BOT_COUNT; i++) {
      bots.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
        size: 20 + Math.random() * 12,
        opacity: 0.1 + Math.random() * 0.08,
        rotation: (Math.random() - 0.5) * 0.3,
        rotSpeed: (Math.random() - 0.5) * 0.004,
        phase: Math.random() * Math.PI * 2,
        type: Math.floor(Math.random() * 3),
        scanAngle: Math.random() * Math.PI * 2
      });
    }
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
        size: 1.5 + Math.random() * 2,
        opacity: 0.08 + Math.random() * 0.08,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }

  function drawRobot(x, y, s, rot, op, phase, type, scanAngle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = op;
    const t = phase;
    const bodyColor = ['#1e3a5f','#2d3748','#1a365d'][type];
    const accentColor = ['#00d4ff','#38bdf8','#22d3ee'][type];
    const metalColor = ['#64748b','#718096','#5a7a98'][type];

    // body
    ctx.fillStyle = bodyColor;
    roundRect(ctx, -s*0.22, -s*0.3, s*0.44, s*0.48, s*0.06);

    // chest panel glow
    ctx.fillStyle = accentColor;
    ctx.globalAlpha = op * (0.15 + 0.1 * Math.sin(t * 1.5));
    roundRect(ctx, -s*0.16, -s*0.24, s*0.32, s*0.32, s*0.03);
    ctx.globalAlpha = op;

    // chest reactor
    ctx.beginPath(); ctx.arc(0, -s*0.08, s*0.06, 0, Math.PI*2);
    ctx.fillStyle = accentColor;
    ctx.globalAlpha = op * (0.4 + 0.4 * Math.sin(t * 2));
    ctx.fill();
    ctx.globalAlpha = op;

    // chest circuit lines
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 0.6;
    ctx.globalAlpha = op * 0.3;
    ctx.beginPath(); ctx.moveTo(-s*0.1, -s*0.08); ctx.lineTo(-s*0.18, -s*0.08); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.1, -s*0.08); ctx.lineTo(s*0.18, -s*0.08); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, s*0.0); ctx.lineTo(0, s*0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.08, s*0.1); ctx.lineTo(s*0.08, s*0.1); ctx.stroke();
    ctx.globalAlpha = op;

    // shoulders
    ctx.fillStyle = metalColor;
    ctx.beginPath(); ctx.arc(-s*0.24, -s*0.24, s*0.055, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.24, -s*0.24, s*0.055, 0, Math.PI*2); ctx.fill();

    // neck
    ctx.fillStyle = metalColor;
    roundRect(ctx, -s*0.04, -s*0.36, s*0.08, s*0.07, s*0.02);

    // head
    ctx.fillStyle = bodyColor;
    roundRect(ctx, -s*0.18, -s*0.58, s*0.36, s*0.24, s*0.05);

    // visor
    ctx.fillStyle = 'rgba(0,200,255,0.08)';
    roundRect(ctx, -s*0.15, -s*0.55, s*0.30, s*0.14, s*0.03);

    // eyes
    ctx.fillStyle = accentColor;
    ctx.globalAlpha = op * (0.5 + 0.4 * Math.sin(t * 2.5));
    ctx.beginPath(); ctx.arc(-s*0.07, -s*0.48, s*0.03, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.07, -s*0.48, s*0.03, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = op;

    // eye scan beam
    ctx.strokeStyle = accentColor;
    ctx.globalAlpha = op * 0.15;
    ctx.lineWidth = 0.5;
    const scanX = Math.cos(scanAngle) * s * 0.5;
    const scanY = Math.sin(scanAngle) * s * 0.3 - s*0.48;
    ctx.beginPath(); ctx.moveTo(0, -s*0.48); ctx.lineTo(scanX, scanY); ctx.stroke();
    ctx.globalAlpha = op;

    // antenna
    ctx.strokeStyle = metalColor; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, -s*0.58); ctx.lineTo(0, -s*0.7); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s*0.72, s*0.025, 0, Math.PI*2);
    ctx.fillStyle = accentColor;
    ctx.globalAlpha = op * (0.4 + 0.5 * Math.sin(t * 4));
    ctx.fill();
    ctx.globalAlpha = op;

    // antenna signal rings
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 0.4;
    for (let r = 1; r <= 3; r++) {
      ctx.globalAlpha = op * Math.max(0, 0.15 - r * 0.04) * (0.5 + 0.5 * Math.sin(t * 3 + r));
      ctx.beginPath(); ctx.arc(0, -s*0.72, s*0.04 * r, -Math.PI*0.8, -Math.PI*0.2); ctx.stroke();
    }
    ctx.globalAlpha = op;

    // ear panels
    ctx.fillStyle = metalColor;
    ctx.fillRect(-s*0.2, -s*0.52, s*0.03, s*0.08);
    ctx.fillRect(s*0.17, -s*0.52, s*0.03, s*0.08);

    // hip
    ctx.fillStyle = bodyColor;
    roundRect(ctx, -s*0.14, s*0.15, s*0.28, s*0.06, s*0.02);

    // legs
    ctx.fillStyle = metalColor;
    roundRect(ctx, -s*0.12, s*0.21, s*0.08, s*0.15, s*0.02);
    roundRect(ctx, s*0.04, s*0.21, s*0.08, s*0.15, s*0.02);

    // feet with glow
    ctx.fillStyle = bodyColor;
    roundRect(ctx, -s*0.14, s*0.35, s*0.1, s*0.04, s*0.01);
    roundRect(ctx, s*0.04, s*0.35, s*0.1, s*0.04, s*0.01);
    ctx.fillStyle = accentColor;
    ctx.globalAlpha = op * 0.2;
    ctx.beginPath(); ctx.ellipse(-s*0.09, s*0.4, s*0.08, s*0.02, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.09, s*0.4, s*0.08, s*0.02, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = op;

    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x+r, y); c.lineTo(x+w-r, y);
    c.quadraticCurveTo(x+w, y, x+w, y+r); c.lineTo(x+w, y+h-r);
    c.quadraticCurveTo(x+w, y+h, x+w-r, y+h); c.lineTo(x+r, y+h);
    c.quadraticCurveTo(x, y+h, x, y+h-r); c.lineTo(x, y+r);
    c.quadraticCurveTo(x, y, x+r, y); c.closePath(); c.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    // particle field
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,180,255,' + (p.opacity * (0.5 + 0.5 * Math.sin(p.pulse))) + ')';
      ctx.fill();
    }

    // connection lines (bot-to-bot)
    for (let i = 0; i < bots.length; i++) {
      for (let j = i + 1; j < bots.length; j++) {
        const dx = bots[i].x - bots[j].x;
        const dy = bots[i].y - bots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 280) {
          const alpha = 0.12 * (1 - dist / 280);
          ctx.beginPath(); ctx.moveTo(bots[i].x, bots[i].y); ctx.lineTo(bots[j].x, bots[j].y);
          ctx.strokeStyle = 'rgba(0,140,220,' + alpha * 3 + ')';
          ctx.lineWidth = 1.2; ctx.stroke();
          // data packet animation
          const progress = (Date.now() * 0.001 + i + j) % 1;
          const px = bots[i].x + (bots[j].x - bots[i].x) * progress;
          const py = bots[i].y + (bots[j].y - bots[i].y) * progress;
          ctx.beginPath(); ctx.arc(px, py, 1.5, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(0,220,255,' + alpha * 4 + ')';
          ctx.fill();
        }
      }
    }

    // bot-to-particle connections
    for (let i = 0; i < bots.length; i++) {
      for (let j = 0; j < particles.length; j++) {
        const dx = bots[i].x - particles[j].x;
        const dy = bots[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath(); ctx.moveTo(bots[i].x, bots[i].y); ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(0,140,220,' + (0.15 * (1 - dist / 120)) + ')';
          ctx.lineWidth = 0.6; ctx.stroke();
        }
      }
    }

    // draw robots
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      b.x += b.vx; b.y += b.vy; b.rotation += b.rotSpeed; b.phase += 0.04;
      b.scanAngle += 0.02;
      if (b.x < -60) b.x = w + 60; if (b.x > w + 60) b.x = -60;
      if (b.y < -60) b.y = h + 60; if (b.y > h + 60) b.y = -60;
      drawRobot(b.x, b.y, b.size, b.rotation, b.opacity, b.phase, b.type, b.scanAngle);
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initBots(); });
  resize(); initBots(); draw();

  const wechatLink = document.querySelector('a[title="WeChat: godxzp"]');
  if (wechatLink) {
    wechatLink.addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('wechat-modal').style.display = 'flex';
    });
  }
})();
</script>
